<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ParcelOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>

    <div class="topbar">
        <p>ParcelOS</p>
        <p id="clock">11/19/2026 8:45 PM</p>
    </div>

    <!--<h1>ParcelOS</h1>-->

    <div class="welcome" style="margin:60px">
        <img src="./assets/spinning-capybara.gif" alt="Spinning capybara">
        <h2>Welcome to ParcelOS, a collaborative webOS.</h2>
        <img src="./assets/spinning-capybara.gif" alt="Spinning capybara">
    </div>

    <div class="desktop">

        <div class="desktop-app" onclick="openApp('About ParcelOS', './apps/about.html')"> <!---About app-->
            <img src="./assets/info.png" alt="About ParcelOS">
            <p>About</p>
        </div>

        <div class="desktop-app" onclick="openApp('Contributors', './apps/contributors.html')">   <!---Contrib app-->
            <img src="./assets/contrib.png" alt="Contributors">
            <p>Contributors</p>
        </div>

        <div class="desktop-app" onclick="openApp('Backgrounds', './apps/backgrounds.html')">
            <img src="./assets/backgrounds.png" alt="Backgrounds">
            <p>Backgrounds</p>
        </div>

        <div class="desktop-app" onclick="openApp('Make An App', './apps/makeanapp.html')"> <!---Make an app-->
            <img src="./assets/floppy.png" alt="Make an App">
            <p>Make an App</p>
        </div>
        
        <div class="desktop-app" onclick="openApp('Cat Clicker', './apps/clicker.html')"> <!---Clicker-->
            <img src="./assets/clicker.png" alt="Clicker">
            <p>Cat Clicker</p>
        </div>
        <div class="desktop-app" onclick="openMalwareWindows()"> <!---Malware-->
            <img src="./assets/malware.png" alt="Malware">
            <p>Malware</p>
        </div>
        <div class="desktop-app" onclick="openApp('Pong', './apps/pong.html')"> <!---Pong-->
            <img src="./assets/pong.png" alt="Pong">
            <p>Pong</p>
        </div>
        <div class="desktop-app" onclick="openApp('Kiwipedia', './apps/kiwipedia.html')"> <!---Kiwipedia-->
            <img src="./assets/kiwipedia.png" alt="Kiwipedia">
            <p>Kiwipedia</p>
        </div>
        <div class="desktop-app" onclick="openApp('Babel', './apps/babel.html')">
            <img src="./assets/babel.png" alt="Library of Babel">
            <p>Mini Library of Babel</p>
        </div>
        <div class="desktop-app" onclick="openApp('Calculator', './apps/calculator.html')">
            <img src="./assets/calculator.png" alt="Calculator">
            <p>Scientific Calculator</p>
        </div>
            <div class="desktop-app" onclick="openApp('Parcel Passer', 'https://quantumkya.github.io/parcel-passer/index.html')">
            <img src="./assets/package.png" alt="Package">
            <p>Parcel Passer Game</p>
        </div>
    </div>

    <div id="windowContainer"></div>

</body>
</html>
