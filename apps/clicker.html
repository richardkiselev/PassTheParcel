
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            background: white;
            color: #333;
        }
        h1 {
            font-size: 28px;
        }
        p {
            line-height: 1.6;
        }
        .cat-button {
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
        }
        #catImage {
            display: block;
            width: 240px;
            height: 240px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Cat Clicker</h1>
    <button class="cat-button" onclick="incrementCount()"><img id="catImage" src="../assets/placeholder.png" alt="A cat"></button>
    <h3 id="count">0 cats</h3>
    <hr>
    <button onclick="purchaseYarn()">Buy YARN! 10 cats and gives you +1 cats per second!</button>
    <button onclick="purchaseMilk()">Buy MILK! 10 cats and gives you +5% cats, every second!</button>
    <button onclick="purchaseCPC()">Buy CATNIP! More cats per click for just 10 coins!</button>
</body>
<script>
    const catImages = [
        "../cats/1.jpg",
        "../cats/2.jpg",
        "../cats/3.jpg",
        "../cats/4.jpg",
        "../cats/5.jpg",
        "../cats/6.jpg",
        "../cats/7.jpg",
        "../cats/8.jpg",
        "../cats/9.jpg",
        "../cats/10.jpg"
    ];
    let clicks = 0;
    let yarnCount = 0;
    let milkCount = 0;
    let catsperclick = 1;
    let currentCatIndex = -1;

    function renderCount() {
        document.getElementById("count").textContent = `${clicks.toFixed(1)} cats`;
    }

    function incrementCount() {
        clicks = clicks + catsperclick;
        renderCount();

        let nextCatIndex = Math.floor(Math.random() * catImages.length);
        if (catImages.length > 1) {
            while (nextCatIndex === currentCatIndex) {
                nextCatIndex = Math.floor(Math.random() * catImages.length);
            }
        }
        currentCatIndex = nextCatIndex;
        document.getElementById("catImage").src = catImages[nextCatIndex];
    }

    function updateClicks() {
        clicks += yarnCount / 10;
        clicks *= 1 + (milkCount / 200);
        renderCount();
    }

    function purchaseYarn() {
        if (clicks >= 10) {
            clicks -= 10;
            yarnCount++;
            renderCount();
        }
        else {
            alert("Not enough cats!")
        }
    }

    function purchaseMilk() {
        if (clicks >= 10) {
            clicks -= 10;
            milkCount++;
            renderCount();
        }
        else {
            alert("Not enough cats!")
        }
    }

    setInterval(updateClicks, 100);

function purchaseCPC() {
        if (clicks >= 10) {
            clicks -= 10;
            catsperclick++;
            renderCount();
        }
        else {
            alert("Not enough cats!")
        }
    }

    setInterval(updateClicks, 100);

</script>
</html>
